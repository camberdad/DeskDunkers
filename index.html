<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#182c3a">
  <title>Desk Dunkers | CamberDad Games</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #182c3a; color: #faf7ee; }
    body { display: grid; place-items: center; padding: 20px; }
    .shell { width: min(100%, 720px); display: grid; gap: 12px; }
    .topline { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding: 0 3px; }
    .brand { color: #91b49b; font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    .subtitle { margin-top: 5px; color: #e9e3d8; font-size: clamp(13px, 2vw, 16px); opacity: .84; }
    .status { color: #f4bb54; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-align: right; text-transform: uppercase; }
    .stage { position: relative; width: min(100%, calc((100dvh - 116px) * 3 / 4)); aspect-ratio: 3 / 4; max-height: calc(100dvh - 116px); margin-inline: auto; overflow: hidden; border: 1px solid #ffffff22; border-radius: 16px; background: #202f37; box-shadow: 0 24px 80px #07121999, 0 2px 0 #ffffff12 inset; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #182c3a; touch-action: none; }
    .loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: radial-gradient(ellipse at 50% 42%, #31505b, #182c3a 70%); transition: opacity .35s ease; }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .monogram { display: grid; place-items: center; width: 76px; height: 76px; border: 2px solid #f4bb54; border-radius: 22px; color: #f4bb54; font-size: 28px; font-weight: 900; transform: rotate(-7deg); box-shadow: 0 10px 40px #0005; }
    .loading-title { color: #faf7ee; font-size: 14px; font-weight: 900; letter-spacing: .2em; }
    .track { width: min(230px, 60vw); height: 5px; overflow: hidden; border-radius: 9px; background: #ffffff22; }
    .fill { width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2c9c92, #f4bb54); transition: width .15s ease; }
    .loading-label { color: #91b49b; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .bottomline { display: flex; justify-content: space-between; gap: 12px; color: #e9e3d8a8; font-size: 11px; }
    .bottomline strong { color: #f4bb54; font-weight: 750; }
    @media (max-width: 640px) { body { padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); } .stage { width: min(calc(100vw - 16px), calc((100dvh - 105px) * 3 / 4)); max-height: calc(100dvh - 105px); border-radius: 10px; } .topline { align-items: center; } .subtitle { max-width: 68vw; } .status { font-size: 9px; } .bottomline { font-size: 9px; } }
    @media (max-aspect-ratio: 3 / 4) and (max-width: 640px) { .shell { gap: 8px; } .stage { width: 100%; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topline">
      <div><div class="brand">CamberDad Games</div><div class="subtitle">A little office break. A very unpredictable fan.</div></div>
      <div class="status">Mouse &amp; touch ready</div>
    </header>
    <div class="stage">
      <canvas id="unity-canvas" width="960" height="1280" tabindex="-1" aria-label="Desk Dunkers game"></canvas>
      <div class="loading" id="loading">
        <div class="monogram">DD</div>
        <div class="loading-title">DESK DUNKERS</div>
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="loading-label" id="loading-label">Getting the paper ready</div>
      </div>
    </div>
    <footer class="bottomline"><span>Read the wind. Flick the paper. Keep the streak alive.</span><span><strong>DESK DUNKERS</strong></span></footer>
  </main>
  <script src="Build/WebGL.loader.js?v=paperball-20261106c"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const fill = document.querySelector("#fill");
    const label = document.querySelector("#loading-label");
    const config = {
      dataUrl: "Build/WebGL.data.unityweb?v=paperball-20261106c",
      frameworkUrl: "Build/WebGL.framework.js.unityweb?v=paperball-20261106c",
      codeUrl: "Build/WebGL.wasm.unityweb?v=paperball-20261106c",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "CamberDad Games",
      productName: "Desk Dunkers",
      productVersion: "0.1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
    };
    createUnityInstance(canvas, config, (progress) => {
      fill.style.width = `${Math.round(progress * 100)}%`;
      label.textContent = progress < 0.7 ? "Getting the paper ready" : "Waking up the desk fan";
    }).then(() => {
      label.textContent = "Ready for your shift";
      window.setTimeout(() => loading.classList.add("hidden"), 300);
    }).catch((error) => {
      label.textContent = "The game could not load. Please refresh and try again.";
      console.error(error);
    });
  </script>
</body>
</html>
